// ================= KHÓA XOAY NGANG KHI CHẠM MÀN HÌNH =================
function lockLandscapeMode() {
if (screen.orientation && screen.orientation.lock) {
screen.orientation.lock('landscape').catch(() => {});
}
}
document.addEventListener('click', lockLandscapeMode, { once: true });
// ================= HỆ THỐNG TÀI KHOẢN & MẬT KHẨU =================
const DB_KEY = 'nsbl_users_db_v2';
const SESSION_KEY = 'nsbl_current_user_v2';
let authMode = 'login';
let currentUser = null;
let account = null;
function getUsersDB() {
return JSON.parse(localStorage.getItem(DB_KEY) || '{}');
}
function saveUsersDB(db) {
localStorage.setItem(DB_KEY, JSON.stringify(db));
}
function saveCurrentAccount() {
if (!currentUser || !account) return;
const db = getUsersDB();
db[currentUser] = account;
saveUsersDB(db);
}
function switchAuthMode(mode) {
authMode = mode;
document.getElementById('auth-msg').innerText = '';
document.getElementById('tab-login').classList.toggle('active', mode === 'login');
document.getElementById('tab-register').classList.toggle('active', mode === 'register');
document.getElementById('auth-displayname').style.display = mode === 'register' ? 'block' : 'none';
document.getElementById('auth-submit-btn').innerText = mode === 'login' ? 'ĐĂNG NHẬP VÀO SẢNH' : 'TẠO TÀI KHOẢN & NHẬN BỘ BỘ';
}
function handleAuth() {
const username = document.getElementById('auth-username').value.trim().toLowerCase();
const password = document.getElementById('auth-password').value.trim();
const displayName = document.getElementById('auth-displayname').value.trim();
const msgEl = document.getElementById('auth-msg');
if (username.length < 3 || password.length < 3) {
msgEl.innerText = 'Tên đăng nhập và mật khẩu phải có ít nhất 3 ký tự!';
return;
}
const db = getUsersDB();
if (authMode === 'register') {
if (db[username]) {
msgEl.innerText = 'Tên đăng nhập này đã tồn tại, hãy chọn tên khác!';
return;
}
db[username] = {
username: username,
password: password,
name: displayName || username,
level: 1,
exp: 0,
maxExp: 100,
talentPoints: 0,
talents: { atk: 0, hp: 0, spd: 0, magnet: 0 }
};
saveUsersDB(db);
loginSuccess(username, db[username]);
} else {
if (!db[username] || db[username].password !== password) {
msgEl.innerText = 'Sai tên đăng nhập hoặc mật khẩu!';
return;
}
loginSuccess(username, db[username]);
}
}
function loginSuccess(username, userData) {
currentUser = username;
account = userData;
localStorage.setItem(SESSION_KEY, username);
document.getElementById('auth-screen').style.display = 'none';
lockLandscapeMode();
openLobby();
}
function logoutAccount() {
localStorage.removeItem(SESSION_KEY);
currentUser = null;
account = null;
document.getElementById('lobby-screen').style.display = 'none';
document.getElementById('auth-screen').style.display = 'flex';
}
// Tự động đăng nhập lại nếu đã lưu phiên
const savedSession = localStorage.getItem(SESSION_KEY);
if (savedSession) {
const db = getUsersDB();
if (db[savedSession]) {
loginSuccess(savedSession, db[savedSession]);
}
}
// ================= GIAO DIỆN SẢNH CHÍNH & CỘNG SKILL =================
const TALENT_DEFS = [
{ key: 'atk', name: '🪓 Rìu Chiến Sắc Bén', desc: '+8 Sát thương mỗi cấp', max: 10 },
{ key: 'hp', name: '❤️ Thể Lực Thổ Dân', desc: '+30 Máu tối đa mỗi cấp', max: 10 },
{ key: 'spd', name: '👟 Bước Chân Thần Tốc', desc: '+6% Tốc độ di chuyển mỗi cấp', max: 10 },
{ key: 'magnet', name: '🧲 Hào Quang Hút Nấm', desc: '+25px Tầm hút nấm tự động', max: 10 }
];
function openLobby() {
document.getElementById('game-screen').style.display = 'none';
document.getElementById('lobby-screen').style.display = 'flex';
updateLobbyUI();
drawHeroPreview();
}
function updateLobbyUI() {
document.getElementById('lobby-name').innerText = account.name;
document.getElementById('lobby-user').innerText = account.username;
document.getElementById('lobby-level').innerText = account.level;
document.getElementById('lobby-exp').innerText = account.exp;
document.getElementById('lobby-max-exp').innerText = account.maxExp;
document.getElementById('lobby-exp-bar').style.width = Math.min(100, (account.exp / account.maxExp) * 100) + '%';
document.getElementById('talent-points').innerText = account.talentPoints;
const listEl = document.getElementById('talent-list');
listEl.innerHTML = '';
TALENT_DEFS.forEach(t => {
const curLv = account.talents[t.key];
const canUpgrade = account.talentPoints > 0 && curLv < t.max;
const item = document.createElement('div');
item.className = 'talent-item';
item.innerHTML = <div class="talent-info"> <h4>${t.name} <span style="color:#2ecc71">[Lv.${curLv}/${t.max}]</span></h4> <p>${t.desc}</p> </div> <button class="btn-plus" ${canUpgrade ? '' : 'disabled'} onclick="upgradeTalent('${t.key}')">+</button>;
listEl.appendChild(item);
});
}
function upgradeTalent(key) {
if (account.talentPoints > 0 && account.talents[key] < 10) {
account.talentPoints--;
account.talents[key]++;
saveCurrentAccount();
updateLobbyUI();
}
}
function drawHeroPreview() {
const pCanvas = document.getElementById('heroPreviewCanvas');
const pCtx = pCanvas.getContext('2d');
pCtx.clearRect(0, 0, 120, 120);
drawBoBoCharacter(pCtx, 60, 65, 30, 0, 0);
}
// ================= HỆ THỐNG ĐỒ HỌA TƯỚNG BỘ BỘ =================
function drawBoBoCharacter(c, x, y, r, angle, attackAnim) {
c.save();
c.translate(x, y);
c.fillStyle = 'rgba(0,0,0,0.25)';
c.beginPath();
c.ellipse(0, r * 0.85, r * 0.9, r * 0.4, 0, 0, Math.PI * 2);
c.fill();
c.beginPath();
c.arc(0, 0, r, 0, Math.PI * 2);
c.fillStyle = '#e67e22';
c.fill();
c.lineWidth = 3;
c.strokeStyle = '#2d3436';
c.stroke();
c.fillStyle = '#6e2c00';
c.beginPath();
c.arc(0, -r * 0.25, r * 0.85, Math.PI, Math.PI * 2);
c.fill();
c.fillStyle = '#fff';
c.strokeStyle = '#2d3436';
c.lineWidth = 2;
c.beginPath();
c.moveTo(-r * 0.6, -r * 0.4);
c.quadraticCurveTo(-r * 1.25, -r * 0.9, -r * 0.85, -r * 1.25);
c.quadraticCurveTo(-r * 0.55, -r * 0.85, -r * 0.35, -r * 0.6);
c.fill(); c.stroke();
c.beginPath();
c.moveTo(r * 0.6, -r * 0.4);
c.quadraticCurveTo(r * 1.25, -r * 0.9, r * 0.85, -r * 1.25);
c.quadraticCurveTo(r * 0.55, -r * 0.85, r * 0.35, -r * 0.6);
c.fill(); c.stroke();
const eyeOffsetX = Math.cos(angle) * (r * 0.28);
const eyeOffsetY = Math.sin(angle) * (r * 0.28);
c.fillStyle = '#fff';
c.beginPath();
c.arc(eyeOffsetX - r * 0.25, eyeOffsetY, r * 0.22, 0, Math.PI * 2);
c.arc(eyeOffsetX + r * 0.25, eyeOffsetY, r * 0.22, 0, Math.PI * 2);
c.fill();
c.fillStyle = '#000';
c.beginPath();
c.arc(eyeOffsetX - r * 0.22, eyeOffsetY, r * 0.1, 0, Math.PI * 2);
c.arc(eyeOffsetX + r * 0.28, eyeOffsetY, r * 0.1, 0, Math.PI * 2);
c.fill();
c.rotate(angle + (attackAnim > 0 ? (0.5 - attackAnim) * 2.4 : -0.4));
c.fillStyle = '#8e44ad';
c.fillRect(r * 0.6, -4, r * 1.1, 8);
c.fillStyle = '#bdc3c7';
c.beginPath();
c.moveTo(r * 1.3, -16);
c.lineTo(r * 1.85, -20);
c.lineTo(r * 1.85, 20);
c.lineTo(r * 1.3, 16);
c.closePath();
c.fill();
c.stroke();
c.restore();
}

this.jumpTime = 0;
this.skillCooldown = 0;
this.zoneTickTimer = 0;
this.dead = false;
this.learnedIcons = [];
this.skills = { spin: false, magnet: false, lifesteal: false };
this.aiTimer = 0;
this.aiDirX = 0;
this.aiDirY = 0;
}
update() {
if (this.dead) return;
if (this.attackAnim > 0) this.attackAnim -= 0.12;
if (this.skillCooldown > 0) this.skillCooldown = Math.max(0, this.skillCooldown - 1/60);
// Kiểm tra sát thương ngoài vòng bo (giống PUBG)
const distFromCenter = Math.hypot(this.x - MAP_CENTER, this.y - MAP_CENTER);
if (distFromCenter > zoneRadius) {
this.zoneTickTimer++;
if (this.zoneTickTimer >= 30) { // Mỗi 0.5 giây mất máu khi ngoài bo
this.zoneTickTimer = 0;
const zoneDmg = Math.max(8, this.maxHp * 0.06);
this.takeDamage(zoneDmg, 0, 0, null);
}
} else {
this.zoneTickTimer = 0;
}
let moveX = 0, moveY = 0;
if (this.isPlayer) {
moveX = joystick.dx;
moveY = joystick.dy;
} else {
this.updateAI(distFromCenter);
moveX = this.aiDirX;
moveY = this.aiDirY;
}
if (this.jumpTime > 0) {
this.jumpTime--;
this.x += Math.cos(this.angle) * (this.speed * 2.9);
this.y += Math.sin(this.angle) * (this.speed * 2.9);
if (this.jumpTime === 0) this.attack(true);
} else {
if (moveX !== 0 || moveY !== 0) {
this.angle = Math.atan2(moveY, moveX);
this.x += moveX * this.speed;
this.y += moveY * this.speed;
}
}
this.x += this.vx;
this.y += this.vy;
this.vx *= 0.85;
this.vy *= 0.85;
this.x = Math.max(this.radius, Math.min(MAP_SIZE - this.radius, this.x));
this.y = Math.max(this.radius, Math.min(MAP_SIZE - this.radius, this.y));
}
updateAI(distFromCenter) {
// Bot tự động chạy vào tâm nếu sắp ra ngoài vòng bo
if (distFromCenter > zoneRadius * 0.85) {
const toCenter = Math.atan2(MAP_CENTER - this.y, MAP_CENTER - this.x);
this.aiDirX = Math.cos(toCenter);
this.aiDirY = Math.sin(toCenter);
return;
}
this.aiTimer--;
let target = null;
let minDist = 360;
fighters.forEach(f => {
if (f !== this && !f.dead) {
const d = Math.hypot(f.x - this.x, f.y - this.y);
if (d < minDist) { minDist = d; target = f; }
}
});
if (target) {
const ang = Math.atan2(target.y - this.y, target.x - this.x);
this.aiDirX = Math.cos(ang);
this.aiDirY = Math.sin(ang);
if (minDist < this.attackRange + this.radius && Math.random() < 0.08) this.attack();
else if (minDist < 220 && this.skillCooldown <= 0 && Math.random() < 0.02) this.useSkill();
} else if (this.aiTimer <= 0) {
this.aiTimer = 45 + Math.random() * 50;
const randAng = Math.random() * Math.PI * 2;
this.aiDirX = Math.cos(randAng);
this.aiDirY = Math.sin(randAng);
}
}
attack(isSkillBonus = false) {
if (this.dead || (!isSkillBonus && this.attackAnim > 0.25)) return;
this.attackAnim = 1.0;
const range = (this.attackRange + this.radius) * (this.skills.spin ? 1.25 : 1);
const dmg = isSkillBonus ? this.damage * 1.35 : this.damage;
fighters.forEach(target => {
if (target === this || target.dead) return;
const dx = target.x - this.x;
const dy = target.y - this.y;
const dist = Math.hypot(dx, dy);
if (dist <= range + target.radius) {
const angleToTarget = Math.atan2(dy, dx);
let angleDiff = Math.abs(angleToTarget - this.angle);
if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
if (this.skills.spin || isSkillBonus || angleDiff < Math.PI / 2.1) {
const knock = isSkillBonus ? 24 : 16;
target.takeDamage(dmg, Math.cos(angleToTarget) * knock, Math.sin(angleToTarget) * knock, this);
if (this.skills.lifesteal) {
this.hp = Math.min(this.maxHp, this.hp + dmg * 0.25);
}
}
}
});
}
useSkill() {
if (this.dead || this.skillCooldown > 0 || this.jumpTime > 0) return;
this.skillCooldown = 4.0;
this.jumpTime = 11;
}
takeDamage(dmg, kx, ky, attacker) {
if (this.dead) return;
this.hp -= dmg;
this.vx += kx;
this.vy += ky;
if (attacker) {
this.recentAttackers.set(attacker, Date.now());
}
if (this.hp <= 0) {
this.dead = true;
this.deaths++;
if (attacker) {
attacker.kills++;
attacker.addWeight(60);
}
const now = Date.now();
this.recentAttackers.forEach((time, assister) => {
if (assister !== attacker && now - time <= 8000) {
assister.assists++;
assister.addWeight(25);
}
});
this.recentAttackers.clear();
for (let i = 0; i < this.level * 4; i++) {
spawnMushroom(this.x + (Math.random() - 0.5) * 90, this.y + (Math.random() - 0.5) * 90, true);
}
// Hồi sinh ngẫu nhiên bên trong vòng bo an toàn
setTimeout(() => {
if (!matchRunning) return;
const spawnR = Math.random() * (zoneRadius * 0.8);
const spawnAng = Math.random() * Math.PI * 2;
this.x = MAP_CENTER + Math.cos(spawnAng) * spawnR;
this.y = MAP_CENTER + Math.sin(spawnAng) * spawnR;
this.hp = this.maxHp;
this.dead = false;
}, 3000);
}
}
addWeight(pts) {
this.weight += pts;
this.hp = Math.min(this.maxHp, this.hp + 4);
if (this.weight >= this.nextLevelWeight) {
this.level++;
this.nextLevelWeight = Math.floor(this.nextLevelWeight * 1.45);
this.radius = Math.min(50, this.baseRadius + this.level * 2.1);
this.maxHp += 25;
this.hp = this.maxHp;
this.damage += 5;
if (this.isPlayer) {
showIngameSkillChoices();
} else {
const rand = INGAME_SKILLS[Math.floor(Math.random() * INGAME_SKILLS.length)];
applyIngameSkill(this, rand);
}
}
}
draw() {
if (this.dead) return;
if (this.attackAnim > 0) {
ctx.save();
ctx.translate(this.x, this.y);
ctx.fillStyle = rgba(255, 255, 255, ${this.attackAnim * 0.45});
ctx.beginPath();
const r = (this.attackRange + this.radius) * (this.skills.spin ? 1.25 : 1);
if (this.skills.spin) {
ctx.arc(0, 0, r, 0, Math.PI * 2);
} else {
ctx.moveTo(0, 0);
ctx.arc(0, 0, r, this.angle - Math.PI / 2.1, this.angle + Math.PI / 2.1);
}
ctx.fill();
ctx.restore();
}
const jumpScale = this.jumpTime > 0 ? 1.25 : 1.0;
drawBoBoCharacter(ctx, this.x, this.y, this.radius * jumpScale, this.angle, this.attackAnim);
ctx.fillStyle = this.isPlayer ? '#f1c40f' : '#ffffff';
ctx.font = 'bold 12px sans-serif';
ctx.textAlign = 'center';
ctx.fillText(Lv.${this.level} ${this.name}, this.x, this.y - this.radius - 22);
const barW = 48;
ctx.fillStyle = 'rgba(0,0,0,0.6)';
ctx.fillRect(this.x - barW / 2, this.y - this.radius - 16, barW, 6);
ctx.fillStyle = this.isPlayer ? '#2ecc71' : '#e74c3c';
ctx.fillRect(this.x - barW / 2, this.y - this.radius - 16, barW * Math.max(0, this.hp / this.maxHp), 6);
}
}
function spawnMushroom(x, y, isMeat = false) {
if (x === undefined || y === undefined) {
const r = Math.random() * (zoneRadius * 0.95);
const ang = Math.random() * Math.PI * 2;
x = MAP_CENTER + Math.cos(ang) * r;
y = MAP_CENTER + Math.sin(ang) * r;
}
mushrooms.push({
x: Math.max(30, Math.min(MAP_SIZE - 30, x)),
y: Math.max(30, Math.min(MAP_SIZE - 30, y)),
value: isMeat ? 25 : 12,
radius: isMeat ? 10 : 7,
isMeat: isMeat,
color: ['#ff6b6b', '#48dbfb', '#1dd1a1', '#feca57'][Math.floor(Math.random() * 4)]
});
}
function showIngameSkillChoices() {
const modal = document.getElementById('skill-modal');
modal.innerHTML = '';
const choices = [...INGAME_SKILLS].sort(() => 0.5 - Math.random()).slice(0, 3);
choices.forEach(sk => {
const btn = document.createElement('button');
btn.className = 'skill-btn';
btn.innerHTML = ${sk.icon} ${sk.name}<br><small style="font-weight:normal">${sk.desc}</small>;
btn.onclick = () => {
applyIngameSkill(player, sk);
modal.style.display = 'none';
};
modal.appendChild(btn);
});
modal.style.display = 'flex';
}
function applyIngameSkill(fighter, sk) {
if (sk.id === 'spin') fighter.skills.spin = true;
if (sk.id === 'magnet') fighter.magnetRadius += 140;
if (sk.id === 'lifesteal') fighter.skills.lifesteal = true;
if (sk.id === 'speed') fighter.speed *= 1.2;
if (sk.id === 'giant') fighter.attackRange *= 1.3;
if (fighter.isPlayer) {
fighter.learnedIcons.push(sk.icon);
const bar = document.getElementById('learned-skills-bar');
bar.innerHTML = fighter.learnedIcons.map(ic => <div class="learned-icon">${ic}</div>).join('');
}
}
// ================= BẮT ĐẦU & KẾT THÚC TRẬN =================
function startMatch() {
lockLandscapeMode();
document.getElementById('lobby-screen').style.display = 'none';
document.getElementById('game-screen').style.display = 'block';
document.getElementById('match-end-screen').style.display = 'none';
document.getElementById('learned-skills-bar').innerHTML = '';
document.getElementById('skill-modal').style.display = 'none';
width = canvas.width = window.innerWidth;
height = canvas.height = window.innerHeight;
joystick.baseX = 90;
joystick.baseY = height - 85;
joystick.stickX = joystick.baseX;
joystick.stickY = joystick.baseY;
zoneRadius = INITIAL_ZONE_RADIUS;
mushrooms = [];
fighters = [];
player = new Fighter(account.name, MAP_CENTER, MAP_CENTER, '#f1c40f', true);
fighters.push(player);
const botNames = ['Lạc Lạc', 'Mu Mu', 'Nện Nện', 'Bóng Bóng', 'Ka Ka', 'Tù Trưởng', 'Bộ Bộ 02', 'Sói Hoang', 'Gấu Đen', 'Cáo Bạc', 'Hổ Vằn'];
for (let i = 0; i < BOT_COUNT; i++) {
const r = 200 + Math.random() * (INITIAL_ZONE_RADIUS - 300);
const ang = Math.random() * Math.PI * 2;
fighters.push(new Fighter(botNames[i], MAP_CENTER + Math.cos(ang) * r, MAP_CENTER + Math.sin(ang) * r, '#e74c3c', false));
}
for (let i = 0; i < MUSHROOM_COUNT; i++) spawnMushroom();
timeLeft = MATCH_DURATION;
matchRunning = true;
updateTimerDisplay();
clearInterval(timerInterval);
timerInterval = setInterval(() => {
if (!matchRunning) return;
timeLeft--;
// Thu nhỏ vòng bo dần về tâm theo thời gian 3 phút
const progress = 1 - (timeLeft / MATCH_DURATION);
zoneRadius = INITIAL_ZONE_RADIUS - progress * (INITIAL_ZONE_RADIUS - MIN_ZONE_RADIUS);
updateTimerDisplay();
if (timeLeft <= 0) {
endMatch();
}
}, 1000);
cancelAnimationFrame(animFrameId);
gameLoop();
}
function updateTimerDisplay() {
const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
const secs = String(timeLeft % 60).padStart(2, '0');
const timerEl = document.getElementById('ui-timer');
const boxEl = document.getElementById('timer-box');
timerEl.innerText = ${mins}:${secs};
const zonePct = Math.round((zoneRadius / INITIAL_ZONE_RADIUS) * 100);
document.getElementById('zone-status').innerText = Vòng bo: ${zonePct}%;
if (timeLeft <= 30) boxEl.classList.add('timer-urgent');
else boxEl.classList.remove('timer-urgent');
}
function endMatch() {
matchRunning = false;
clearInterval(timerInterval);
const sorted = [...fighters].sort((a, b) => b.weight - a.weight);
const rank = sorted.indexOf(player) + 1;
const expGained = 50 + player.kills * 15 + player.assists * 8 + (rank <= 3 ? 45 : 15);
account.exp += expGained;
let leveledUpMsg = "";
while (account.exp >= account.maxExp) {
account.exp -= account.maxExp;
account.level++;
account.talentPoints++;
account.maxExp = Math.floor(account.maxExp * 1.3);
leveledUpMsg = 🎉 LÊN CẤP LV.${account.level} (+1 Điểm Kỹ Năng)!;
}
saveCurrentAccount();
document.getElementById('end-rank').innerText = Hạng ${rank} / ${fighters.length} (${player.weight} Kg);
document.getElementById('end-kda').innerText = Thành tích: ${player.kills} Giết / ${player.deaths} Chết / ${player.assists} Hỗ trợ;
document.getElementById('end-exp-gain').innerText = +${expGained} EXP${leveledUpMsg};
document.getElementById('match-end-screen').style.display = 'flex';
}
function returnToLobby() {
cancelAnimationFrame(animFrameId);
openLobby();
}
// ================= VẼ BẢN ĐỒ NHIỆT (HEATMAP RADAR) TRÊN CÙNG =================
function drawHeatmapRadar() {
const size = 90;
const half = size / 2;
const scale = half / INITIAL_ZONE_RADIUS;
heatCtx.clearRect(0, 0, size, size);
// Nền bản đồ tròn
heatCtx.fillStyle = '#1e272e';
heatCtx.beginPath();
heatCtx.arc(half, half, half, 0, Math.PI * 2);
heatCtx.fill();
// Vùng an toàn hiện tại trên radar
heatCtx.fillStyle = 'rgba(46, 204, 113, 0.25)';
heatCtx.strokeStyle = '#2ecc71';
heatCtx.lineWidth = 1.5;
heatCtx.beginPath();
heatCtx.arc(half, half, zoneRadius * scale, 0, Math.PI * 2);
heatCtx.fill();
heatCtx.stroke();
// Vùng nhiệt địch (tỏa nhiệt đỏ/cam tại vị trí kẻ địch)
fighters.forEach(f => {
if (f.dead || f.isPlayer) return;
const rx = half + (f.x - MAP_CENTER) * scale;
const ry = half + (f.y - MAP_CENTER) * scale;
const grad = heatCtx.createRadialGradient(rx, ry, 1, rx, ry, 12);
grad.addColorStop(0, 'rgba(255, 71, 87, 0.95)');
grad.addColorStop(0.5, 'rgba(255, 165, 2, 0.45)');
grad.addColorStop(1, 'rgba(255, 165, 2, 0)');
heatCtx.fillStyle = grad;
heatCtx.beginPath();
heatCtx.arc(rx, ry, 12, 0, Math.PI * 2);
heatCtx.fill();
});
// Vị trí của người chơi (Chấm vàng nổi bật)
if (player && !player.dead) {
const px = half + (player.x - MAP_CENTER) * scale;
const py = half + (player.y - MAP_CENTER) * scale;
heatCtx.fillStyle = '#f1c40f';
heatCtx.beginPath();
heatCtx.arc(px, py, 3.5, 0, Math.PI * 2);
heatCtx.fill();
heatCtx.strokeStyle = '#fff';
heatCtx.lineWidth = 1;
heatCtx.stroke();
}
}
// ================= ĐIỀU KHIỂN JOYSTICK TRÁI & NÚT PHẢI =================
canvas.addEventListener('touchstart', e => {
for (let t of e.changedTouches) {
if (t.clientX < width * 0.45 && !joystick.active) {
joystick.active = true;
joystick.touchId = t.identifier;
joystick.baseX = t.clientX;
joystick.baseY = t.clientY;
joystick.stickX = t.clientX;
joystick.stickY = t.clientY;
}
}
});
canvas.addEventListener('touchmove', e => {
for (let t of e.changedTouches) {
if (joystick.active && t.identifier === joystick.touchId) {
const dx = t.clientX - joystick.baseX;
const dy = t.clientY - joystick.baseY;
const dist = Math.hypot(dx, dy);
const maxR = 45;
if (dist > 0) {
const clamped = Math.min(dist, maxR);
joystick.stickX = joystick.baseX + (dx / dist) * clamped;
joystick.stickY = joystick.baseY + (dy / dist) * clamped;
joystick.dx = (dx / dist) * (clamped / maxR);
joystick.dy = (dy / dist) * (clamped / maxR);
}
}
}
});
canvas.addEventListener('touchend', e => {
for (let t of e.changedTouches) {
if (t.identifier === joystick.touchId) {
joystick.active = false;
joystick.dx = joystick.dy = 0;
joystick.baseX = 90;
joystick.baseY = height - 85;
joystick.stickX = joystick.baseX;
joystick.stickY = joystick.baseY;
}
}
});
document.getElementById('btn-attack').addEventListener('touchstart', e => { e.preventDefault(); if (player) player.attack(); });
document.getElementById('btn-attack').addEventListener('mousedown', () => { if (player) player.attack(); });
document.getElementById('btn-skill').addEventListener('touchstart', e => { e.preventDefault(); if (player) player.useSkill(); });
document.getElementById('btn-skill').addEventListener('mousedown', () => { if (player) player.useSkill(); });
const keys = {};
window.addEventListener('keydown', e => {
keys[e.code] = true;
if (e.code === 'KeyJ' && player) player.attack();
if (e.code === 'Space' && player) player.useSkill();
updateKeyMove();
});
window.addEventListener('keyup', e => { keys[e.code] = false; updateKeyMove(); });
function updateKeyMove() {
let x = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
let y = (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0);
const len = Math.hypot(x, y);
joystick.dx = len > 0 ? x / len : 0;
joystick.dy = len > 0 ? y / len : 0;
}
// ================= VÒNG LẶP VẼ TRẬN ĐẤU =================
function gameLoop() {
if (!matchRunning) return;
ctx.clearRect(0, 0, width, height);
const camX = player.x - width / 2;
const camY = player.y - height / 2;
ctx.save();
ctx.translate(-camX, -camY);
// Nền bãi cỏ ô vuông
const tileSize = 80;
const startCol = Math.max(0, Math.floor(camX / tileSize));
const endCol = Math.min(MAP_SIZE / tileSize, Math.ceil((camX + width) / tileSize));
const startRow = Math.max(0, Math.floor(camY / tileSize));
const endRow = Math.min(MAP_SIZE / tileSize, Math.ceil((camY + height) / tileSize));
for (let r = startRow; r < endRow; r++) {
for (let c = startCol; c < endCol; c++) {
ctx.fillStyle = (r + c) % 2 === 0 ? '#6ab04c' : '#badc58';
ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
}
}
// Vùng bo độc ngoài vòng tròn (giống PUBG)
ctx.save();
ctx.beginPath();
ctx.rect(0, 0, MAP_SIZE, MAP_SIZE);
ctx.arc(MAP_CENTER, MAP_CENTER, zoneRadius, 0, Math.PI * 2, true);
ctx.fillStyle = 'rgba(231, 76, 60, 0.35)';
ctx.fill();
ctx.restore();
// Đường viền vòng bo an toàn
ctx.strokeStyle = '#ff4757';
ctx.lineWidth = 6;
ctx.beginPath();
ctx.arc(MAP_CENTER, MAP_CENTER, zoneRadius, 0, Math.PI * 2);
ctx.stroke();
// Đường chỉ dẫn từ người chơi vào tâm bo nếu đang đứng ngoài bo
const distPlayerCenter = Math.hypot(player.x - MAP_CENTER, player.y - MAP_CENTER);
if (distPlayerCenter > zoneRadius) {
ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
ctx.setLineDash([10, 10]);
ctx.lineWidth = 3;
ctx.beginPath();
ctx.moveTo(player.x, player.y);
ctx.lineTo(MAP_CENTER, MAP_CENTER);
ctx.stroke();
ctx.setLineDash([]);
}
// Nấm & Đùi thịt
for (let i = mushrooms.length - 1; i >= 0; i--) {
const m = mushrooms[i];
let eaten = false;
for (let f of fighters) {
if (f.dead) continue;
const d = Math.hypot(f.x - m.x, f.y - m.y);
if (d < f.magnetRadius) {
m.x += (f.x - m.x) * 0.14;
m.y += (f.y - m.y) * 0.14;
}
if (d < f.radius + m.radius) {
f.addWeight(m.value);
eaten = true;
break;
}
}
if (eaten) {
mushrooms.splice(i, 1);
if (mushrooms.length < MUSHROOM_COUNT) spawnMushroom();
continue;
}
ctx.fillStyle = '#fff';
ctx.fillRect(m.x - 3, m.y, 6, 7);
ctx.beginPath();
ctx.arc(m.x, m.y, m.radius, Math.PI, Math.PI * 2);
ctx.fillStyle = m.isMeat ? '#e17055' : m.color;
ctx.fill();
}
fighters.forEach(f => { f.update(); f.draw(); });
ctx.restore();
// Vẽ Joystick trái
ctx.beginPath();
ctx.arc(joystick.baseX, joystick.baseY, 48, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
ctx.fill();
ctx.lineWidth = 2;
ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
ctx.stroke();
ctx.beginPath();
ctx.arc(joystick.stickX, joystick.stickY, 20, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
ctx.fill();
// Cập nhật Bản đồ nhiệt (Radar)
drawHeatmapRadar();
// Cập nhật UI HUD
document.getElementById('ui-kills').innerText = player.kills;
document.getElementById('ui-deaths').innerText = player.deaths;
document.getElementById('ui-assists').innerText = player.assists;
document.getElementById('ui-weight').innerText = player.weight;
const cdOverlay = document.getElementById('skill-cd-overlay');
if (player.skillCooldown > 0) {
cdOverlay.style.display = 'flex';
cdOverlay.innerText = Math.ceil(player.skillCooldown);
} else {
cdOverlay.style.display = 'none';
}
const top = [...fighters].sort((a, b) => b.weight - a.weight).slice(0, 6);
document.getElementById('lb-list').innerHTML = top
.map((f, idx) => <div style="color:${f.isPlayer ? '#f1c40f' : '#fff'}">${idx + 1}. ${f.name} <b>${f.weight}</b></div>).join('');
animFrameId = requestAnimationFrame(gameLoop);
}
