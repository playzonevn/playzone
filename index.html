
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYZONE - Neon Gaming</title>
<style>

/* PLAYZONE UPGRADE */
body {
  background: var(--bg);
  color: var(--text);
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.theme-select {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px;
}

.category-bar {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 12px 0;
}

.category-btn {
  white-space: nowrap;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  border-radius: 30px;
  padding: 9px 15px;
  cursor: pointer;
}

.category-btn.active,
.category-btn:hover {
  background: var(--cyan);
  color: #08101b;
}

.ad-slot {
  width: 100%;
  min-height: 90px;
  border: 1px dashed var(--muted);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 25px 0;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.page-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #000b;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.page-modal.show {
  display: flex;
}

.page-content {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 25px;
  max-width: 700px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
}

@media(max-width:768px) {
  .category-bar {
    flex-wrap: nowrap;
  }
}

:root {
  --bg: #080b16;
  --panel: #11182a;
  --panel2: #19233a;
  --text: #f4f7ff;
  --muted: #929db5;
  --cyan: #35d9ff;
  --purple: #a855f7;
  --pink: #ff4fd8;
  --line: #26334f;
  --shadow: 0 18px 55px #0008;
}

/* MATRIX */
body[data-theme="matrix"] {
  --bg: #020a05;
  --panel: #07180d;
  --panel2: #0c2815;
  --text: #d7ffe1;
  --muted: #80b58d;
  --cyan: #39ff78;
  --purple: #00a84f;
  --line: #174b2b;
}

/* RETRO ARCADE */
body[data-theme="retro"] {
  --bg: #171027;
  --panel: #26183f;
  --panel2: #352052;
  --text: #fff1d6;
  --muted: #c4a9d8;
  --cyan: #ffe66d;
  --purple: #ff5c8a;
  --line: #60417c;
}

/* LIGHT MODERN */
body[data-theme="light"] {
  --bg: #eef3fb;
  --panel: #ffffff;
  --panel2: #e4ebf7;
  --text: #18243a;
  --muted: #61718c;
  --cyan: #087fa5;
  --purple: #7651bd;
  --line: #cbd6e7;
  --shadow: 0 18px 55px #263b5b22;
}

/* CANDY POP */
body[data-theme="candy"] {
  --bg: #fff0f7;
  --panel: #ffffff;
  --panel2: #ffe0ef;
  --text: #46213b;
  --muted: #92647f;
  --cyan: #e63b9a;
  --purple: #8e56db;
  --line: #f2c5df;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
header{padding:22px 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #25304a;background:#0b1020;position:sticky;top:0;z-index:5}
.logo{font-size:27px;font-weight:900;letter-spacing:2px;color:var(--cyan);text-shadow:0 0 15px #35d9ff80}
.logo span{color:white}
button,input{font:inherit}
button{cursor:pointer}
.lang{background:var(--panel2);border:1px solid #35415c;color:white;border-radius:9px;padding:10px 15px}
.hero{text-align:center;padding:65px 15px 40px;background:radial-gradient(ellipse at top,#172b50 0%,#080b16 65%)}
.hero h1{font-size:clamp(36px,7vw,65px);margin:0 0 15px;font-weight:900}
.hero h1 span{color:var(--cyan);text-shadow:0 0 25px #35d9ff80}
.hero p{color:var(--muted);font-size:16px}
.search{width:min(500px,90%);padding:15px 18px;margin-top:20px;border-radius:12px;border:1px solid #35415c;background:#11182a;color:white;outline:none}
main{max-width:1200px;margin:auto;padding:20px 22px 70px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0}
.section-title h2{font-size:23px}
.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:17px}
.game-card{background:linear-gradient(145deg,#17223a,#101626);border:1px solid #273653;border-radius:16px;padding:22px;min-height:165px;transition:.2s;cursor:pointer}
.game-card:hover{transform:translateY(-5px);border-color:var(--cyan);box-shadow:0 8px 30px #35d9ff20}
.emoji{font-size:36px;margin-bottom:14px}
.game-card h3{margin:0 0 8px;font-size:17px}
.game-card p{color:var(--muted);font-size:13px;margin:0}
.play{display:inline-block;margin-top:17px;color:var(--cyan);font-size:13px;font-weight:bold}
footer{text-align:center;color:var(--muted);padding:30px;border-top:1px solid #25304a}
.modal{display:none;position:fixed;inset:0;background:#030611ed;z-index:10;overflow:auto;padding:20px}
.modal.show{display:flex;align-items:center;justify-content:center}
.dialog{width:min(700px,100%);background:#11182a;border:1px solid #34425f;border-radius:18px;padding:25px;position:relative;min-height:350px}
.close{position:absolute;right:17px;top:15px;background:#27334b;border:0;color:white;border-radius:8px;padding:9px 13px}
#gameTitle{font-size:24px;margin:0 70px 10px 0}
#gameArea{text-align:center;padding:22px 5px;min-height:220px}
.action{background:linear-gradient(100deg,#168cbd,#8046d5);border:0;color:white;padding:11px 18px;border-radius:9px;margin:5px;font-weight:bold}
.secondary{background:#26334d;border:1px solid #465574;color:white;padding:10px 15px;border-radius:9px;margin:5px}
.game-input{background:#080e1c;border:1px solid #42516e;color:white;padding:12px;border-radius:8px;width:min(250px,90%);margin:8px}
.board{display:grid;gap:6px;justify-content:center;margin:15px auto}
.cell{width:62px;height:62px;background:#202e49;border:1px solid #3a4b69;border-radius:9px;color:white;font-size:25px;font-weight:bold}
.cell:hover{border-color:var(--cyan)}
.big{font-size:35px;font-weight:bold;margin:15px}
.info{color:var(--muted);margin:12px}
canvas{background:#050a16;border:1px solid #35415c;border-radius:10px;max-width:100%}
@media(max-width:600px){header{padding:15px}.logo{font-size:21px}.hero{padding-top:45px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game-card{padding:15px;min-height:155px}.cell{width:48px;height:48px}}

/* ===== PLAYZONE FOOTER DESIGN ===== */

.page-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 30px 20px;
  margin-top: 45px;
  border-top: 1px solid var(--line);
  background: var(--panel);
}

.page-links button {
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.25s ease;
}

.page-links button:hover {
  color: var(--cyan);
  border-color: var(--cyan);
  background: var(--panel2);
  transform: translateY(-2px);
}

/* ===== INFORMATION POPUP ===== */

.page-modal {
  backdrop-filter: blur(8px);
  background: rgba(0, 0, 0, 0.78);
}

.page-content {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--cyan);
  border-radius: 18px;
  padding: 32px;
  box-shadow: 0 0 35px rgba(53, 217, 255, 0.15);
  animation: pageAppear 0.25s ease;
}

.page-content > button {
  display: block;
  margin-left: auto;
  background: var(--panel2);
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 13px;
  font-size: 13px;
}

.page-content > button:hover {
  color: var(--cyan);
  border-color: var(--cyan);
}

#pageContent h2 {
  color: var(--cyan);
  font-size: 25px;
  margin: 20px 0;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--line);
}

#pageContent p {
  color: var(--text);
  font-size: 15px;
  line-height: 1.8;
  margin: 15px 0;
}

@keyframes pageAppear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media(max-width:600px) {
  .page-links {
    gap: 6px;
    padding: 22px 10px;
  }

  .page-links button {
    padding: 9px 10px;
    font-size: 12px;
  }

  .page-content {
    padding: 20px;
  }

  #pageContent h2 {
    font-size: 21px;
  }
}
</style>
</head>
<body>
<header>
 <div class="logo">PLAY<span>ZONE</span> ⚡</div>

<select id="themeSelect" class="theme-select">
  <option value="neon">⚡ Neon Cyber</option>
  <option value="matrix">💚 Matrix</option>
  <option value="retro">🕹️ Retro Arcade</option>
  <option value="light">☀️ Light Modern</option>
  <option value="candy">🍬 Candy Pop</option>
</select>

<button class="lang" id="langBtn">🇻🇳 Tiếng Việt</button>
</header>
<section class="hero">
 <h1 id="heroTitle">ENTER THE <span>GAME ZONE</span></h1>
 <p id="heroDesc">Your world. Your games. Your rules.</p>
 <input class="search" id="search" placeholder="🔍 Tìm kiếm trò chơi...">
</section>
<main>
 <div class="section-title"><h2 id="listTitle">🎮 Khám phá trò chơi</h2><span class="count">17 GAMES</span></div>
<div class="category-bar" id="categoryBar">
  <button class="category-btn active" data-category="All">All</button>
  <button class="category-btn" data-category="Arcade">Arcade</button>
  <button class="category-btn" data-category="Puzzle">Puzzle</button>
  <button class="category-btn" data-category="Strategy">Strategy</button>
  <button class="category-btn" data-category="Action">Action</button>
  <button class="category-btn" data-category="Brain">Brain</button>
  <button class="category-btn" data-category="Sports">Sports</button>
</div>

<div class="grid" id="gameGrid"></div>
<div id="gameCount"></div>

</main>

<div class="page-links">
  <button onclick="showPage('about')">About Us</button>
  <button onclick="showPage('contact')">Contact Us</button>
  <button onclick="showPage('privacy')">Privacy Policy</button>
  <button onclick="showPage('terms')">Terms of Service</button>
  <button onclick="showPage('disclaimer')">Disclaimer</button>
  <button onclick="showPage('cookies')">Cookie Policy</button>
</div>

<div id="pageModal" class="page-modal">
  <div class="page-content">
    <button onclick="closePage()">✕ Close</button>
    <div id="pageContent"></div>
  </div>
</div>
<div class="modal" id="modal">
 <div class="dialog">
  <button class="close" id="closeBtn">✕</button>
  <h2 id="gameTitle"></h2>
  <div id="gameArea"></div>
 </div>
</div>
<script>
const games=[
 ["🐍","Snake","Rắn săn mồi","Snake Game"],
 ["⭕","Tic Tac Toe","Cờ caro 3x3","Tic Tac Toe"],
 ["🔢","2048","Ghép số đến 2048","2048 Puzzle"],
 ["🧠","Memory Match","Lật thẻ ghi nhớ","Memory Match"],
 ["💣","Minesweeper","Dò mìn","Minesweeper"],
 ["🧱","Brick Breaker","Phá gạch","Brick Breaker"],
 ["🏓","Pong","Bóng bàn arcade","Pong"],
 ["✊","Rock Paper Scissors","Kéo búa bao","Rock Paper Scissors"],
 ["🎯","Guess Number","Đoán số bí mật","Guess the Number"],
 ["🐹","Whack-a-Mole","Đập chuột","Whack-a-Mole"],
 ["🎵","Simon Says","Ghi nhớ màu sắc","Simon Says"],
 ["🔤","Hangman","Đoán từ tiếng Anh","Hangman"],
 ["⌨️","Typing Speed","Thử tốc độ gõ","Typing Speed"],
 ["⚡","Reaction Test","Kiểm tra phản xạ","Reaction Test"],
 ["➗","Math Challenge","Thử thách toán học","Math Challenge"],
 ["🔴","Connect Four","Cờ kết nối bốn","Connect Four"],
 ["➗","Math Challenge","Thử thách toán học","Math Challenge"],
 ["🔴","Connect Four","Cờ kết nối bốn","Connect Four"],
 ["🏹","Đấu Trường Bộ Lạc","Sinh tồn ăn nấm tăng cấp","Tribal Arena"]
];
let english = false;
/* THEME SYSTEM */
const themeSelect = document.getElementById("themeSelect");

function setTheme(theme) {
  document.body.dataset.theme = theme;
  localStorage.setItem("playzone-theme", theme);
}

themeSelect.addEventListener("change", function () {
  setTheme(this.value);
});

const savedTheme = localStorage.getItem("playzone-theme");

if (savedTheme) {
  themeSelect.value = savedTheme;
  setTheme(savedTheme);
}

/* GAME CATEGORY */
let activeCategory = "All";

const gameCategories = [
  "Arcade",
  "Strategy",
  "Puzzle",
  "Brain",
  "Puzzle",
  "Arcade",
  "Sports",
  "Arcade",
  "Brain",
  "Action",
  "Brain",
  "Brain",
  "Brain",
  "Action",
  "Brain",
  "Strategy",
  "Action"
];
const grid=document.getElementById("gameGrid");
const search=document.getElementById("search");
function drawGrid(){
 grid.innerHTML="";
 games.forEach((g,i)=>{
  let name=english?g[3]:g[1],desc=english?g[3]:g[2];
  if(!(name+" "+desc).toLowerCase().includes(search.value.toLowerCase()))return;
  let card=document.createElement("div");card.className="game-card";
  card.innerHTML=`${i===16 ? '<img src="cover-bo-lac.png" style="width:100%;height:95px;object-fit:cover;border-radius:10px;margin-bottom:10px;">' : `<div class="emoji">${g[0]}</div>`}
<h3>${name}</h3><p>${desc}</p><span class="play">${english?"▶ PLAY NOW":"▶ CHƠI NGAY"}</span>`;
  card.onclick=()=>openGame(i);grid.appendChild(card);
 });
}
search.oninput=drawGrid;
document.getElementById("langBtn").onclick=()=>{
 english=!english;
 document.getElementById("langBtn").textContent=english?"🇬🇧 English":"🇻🇳 Tiếng Việt";
 document.getElementById("heroTitle").innerHTML=english?'ENTER THE <span>GAME ZONE</span>':'BƯỚC VÀO <span>THẾ GIỚI GAME</span>';
 document.getElementById("heroDesc").textContent=english?"Your world. Your games. Your rules.":"Thế giới của bạn. Trò chơi của bạn.";
 document.getElementById("listTitle").textContent=english?"🎮 Explore Games":"🎮 Khám phá trò chơi";
 search.placeholder=english?"🔍 Search games...":"🔍 Tìm kiếm trò chơi...";
 drawGrid();
};
const area=document.getElementById("gameArea");
const modal=document.getElementById("modal");
document.getElementById("closeBtn").onclick=()=>{modal.classList.remove("show");stopGame()};
let cleanup=()=>{};
function stopGame(){cleanup();cleanup=()=>{}}
function openGame(i){
 if(i===16){ window.location.href = "dau-truong-bo-lac.html"; return; }
 stopGame();modal.classList.add("show");
 document.getElementById("gameTitle").textContent=games[i][0]+" "+(english?games[i][3]:games[i][1]);
 area.innerHTML="";
 const el=(tag,cls,txt,parent=area)=>{let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;parent.appendChild(x);return x};
 const btn=(txt,fn)=>{let b=el("button","action",txt);b.onclick=fn;return b};
 const info=txt=>el("div","info",txt);
 const board=(n)=>{let b=el("div","board");b.style.gridTemplateColumns=`repeat(${n},auto)`;return b};
 const cell=(b,txt,fn)=>{let c=el("button","cell",txt,b);c.onclick=fn;return c};
 const input=(placeholder)=>{let x=el("input","game-input");x.placeholder=placeholder;return x};
 const say=txt=>{status.textContent=txt};
 let status=info(english?"Good luck!":"Chúc bạn chơi vui!");
 const again=()=>openGame(i);

 // 1 SNAKE
 if(i===0){
  let c=el("canvas");c.width=400;c.height=400;let ctx=c.getContext("2d");
  let snake=[{x:8,y:8}],food={x:13,y:10},dir={x:1,y:0},score=0,alive=true;
  function draw(){
   ctx.fillStyle="#080e1c";ctx.fillRect(0,0,400,400);
   ctx.fillStyle="#35d9ff";snake.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18));
   ctx.fillStyle="#f05";ctx.fillRect(food.x*20,food.y*20,18,18);
   let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
   if(h.x<0||h.x>=20||h.y<0||h.y>=20||snake.some(p=>p.x===h.x&&p.y===h.y)){alive=false;clearInterval(timer);say("Game Over! Score: "+score);return}
   snake.unshift(h);
   if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};say("Score: "+score)}else snake.pop();
  }
  let timer=setInterval(draw,140);
  const key=e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d&&!(d[0]===-dir.x&&d[1]===-dir.y))dir={x:d[0],y:d[1]}};
  window.addEventListener("keydown",key);cleanup=()=>{clearInterval(timer);window.removeEventListener("keydown",key)};
  info(english?"Use arrow keys to move.":"Dùng phím mũi tên để di chuyển.");
  btn("↻ Restart",again);
 }
 // 2 TIC TAC TOE
 if(i===1){
  let a=Array(9).fill(""),turn="X",done=false,b=board(3);
  function check(){let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
   let w=wins.find(x=>a[x[0]]&&a[x[0]]===a[x[1]]&&a[x[1]]===a[x[2]]);
   if(w){done=true;say(w[0]&&false?"":"Winner: "+a[w[0]])}else if(a.every(Boolean)){done=true;say("Draw!")}else turn=turn==="X"?"O":"X";
  }
  a.forEach((v,j)=>cell(b,"",()=>{if(done||a[j])return;a[j]=turn;b.children[j].textContent=turn;check()}));
  btn("↻ Restart",again);
 }
 // 3 2048
 if(i===2){
  let a=Array(16).fill(0);a[Math.floor(Math.random()*16)]=2;
  function spawn(){let z=a.map((v,j)=>v? -1:j).filter(v=>v>=0);if(z.length)a[z[Math.floor(Math.random()*z.length)]]=Math.random()<.9?2:4}
  function render(){area.querySelector(".board")?.remove();let b=board(4);a.forEach(v=>cell(b,v||"",()=>{}).style.background=v?"#315a83":"#202e49")}
  function move(d){let old=a.join();for(let k=0;k<4;k++){let ids=Array.from({length:4},(_,j)=>d===0?k*4+j:d===1?k*4+3-j:d===2?j*4+k:(3-j)*4+k);let vals=ids.map(x=>a[x]).filter(Boolean),out=[];for(let j=0;j<vals.length;j++){if(vals[j]===vals[j+1]){out.push(vals[j]*2);j++}else out.push(vals[j])}ids.forEach((id,j)=>a[id]=out[j]||0)}if(old!==a.join())spawn();render()}
  const key=e=>{let d={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(d!==undefined){e.preventDefault();move(d)}};
  window.addEventListener("keydown",key);cleanup=()=>window.removeEventListener("keydown",key);
  spawn();render();info("Dùng phím mũi tên để ghép các ô số.");btn("↻ Restart",again);
 }
 // 4 MEMORY
 if(i===3){
  let vals=[1,2,3,4,5,6,1,2,3,4,5,6].sort(()=>Math.random()-.5),opened=[],matched=[];
  let b=board(4);
  vals.forEach((v,j)=>cell(b,"❔",function(){
   if(opened.length===2||matched.includes(j)||opened.includes(j))return;
   this.textContent=v;opened.push(j);
   if(opened.length===2){if(vals[opened[0]]===vals[opened[1]]){matched.push(...opened);opened=[];say("Pairs: "+matched.length/2);if(matched.length===12)say("You win!")}else setTimeout(()=>{opened.forEach(k=>b.children[k].textContent="❔");opened=[]},700)}
  }));
  btn("↻ Restart",again);
 }
 // 5 MINESWEEPER
 if(i===4){
  let mines=new Set();while(mines.size<8)mines.add(Math.floor(Math.random()*64));
  let opened=new Set(),b=board(8);
  for(let j=0;j<64;j++)cell(b,"",function(){
   if(opened.has(j))return;opened.add(j);
   if(mines.has(j)){this.textContent="💣";say("Game Over!");b.querySelectorAll("button").forEach((x,k)=>{if(mines.has(k))x.textContent="💣"});return}
   let n=[j-9,j-8,j-7,j-1,j+1,j+7,j+8,j+9].filter(k=>k>=0&&k<64&&Math.abs(k%8-j%8)<=1&&mines.has(k)).length;
   this.textContent=n||"·";this.style.background="#17634f";
   if(opened.size===56)say("You win!");
  });
  btn("↻ Restart",again);
 }
 // 6 BRICK BREAKER
 if(i===5){
